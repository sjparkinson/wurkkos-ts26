[workspace]
members = ["xtask"]

[workspace.package]
edition = "2024"
authors = ["Samuel Parkinson <samuel.parkinson@hey.com>"]
repository = "https://github.com/sjparkinson/wurkkos-ts26"
license = "MIT"

[workspace.lints.rust]
# Only src/avr/hw.rs, src/avr/rt.rs, the #[unsafe(no_mangle)] on main and the
# no_mangle items in examples/link.rs may opt back in.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
nursery = { level = "warn", priority = -1 }
# `if let ... else` reads better here than `map_or_else` with two closures.
option_if_let_else = "allow"
# `pub(crate)` inside private modules says who uses an item, not who can.
redundant_pub_crate = "allow"

[package]
name = "ts26"
description = "Firmware for the Wurkkos TS26 torch."
readme = "README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
# The fake ADC and reading helpers in src/testing.rs, for xtask's simulators.
# Never on in the firmware.
testing = []

[[bin]]
name = "ts26"
test = false
bench = false

# Checks link.x and src/avr/rt.rs with real statics. Never flashed.
[[example]]
name = "link"
test = false
bench = false

[lints]
workspace = true

# Panics can't unwind on AVR. Size beats speed on 16 KB of flash, and debug
# info only lands in the ELF, never in the hex.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true
# Every sum, difference, product and shift LLVM can't prove fits then links a
# panic, and `no_panics` in xtask/src/layout.rs fails `cargo xtask hex` on any
# panic machinery. Together they prove the firmware never wraps by accident.
# Wrapping on purpose takes `wrapping_*`, which says so where it happens.
overflow-checks = true

[profile.dev]
panic = "abort"
opt-level = "s"
