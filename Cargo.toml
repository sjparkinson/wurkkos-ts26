[workspace]
members = ["xtask"]

[workspace.package]
edition = "2024"
authors = ["Samuel Parkinson <samuel.parkinson@hey.com>"]
repository = "https://github.com/sjparkinson/wurkkos-ts26"
license = "MIT"

[workspace.lints.rust]
warnings = "deny"
# Only src/avr/hw.rs, src/avr/rt.rs, the #[unsafe(no_mangle)] on main and the
# exported items in examples/ may opt back in.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# includes lintgroups correctness, suspicious, complexity, perf, style:
all = "deny"
pedantic = "deny"
nursery = "deny"
# from clippy:restriction:
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
fn_to_numeric_cast_any = "deny"
mixed_read_write_in_expression = "deny"
host_endian_bytes = "deny"
suspicious_xor_used_as_pow = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
iter_over_hash_type = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
float_arithmetic = "deny"

[package]
name = "ts26"
description = "Firmware for the Wurkkos TS26 torch."
readme = "README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
# The fake ADC and reading helpers in src/testing.rs, for xtask's simulators.
# Never on in the firmware.
testing = []

[[bin]]
name = "ts26"
test = false
bench = false

# Checks link.x and src/avr/rt.rs with real statics. Never flashed.
[[example]]
name = "link"
test = false
bench = false

# Runs src/avr/hw.rs's guards that the firmware never reaches. Never flashed.
[[example]]
name = "guards"
test = false
bench = false

# Indexes out of bounds, so xtask's tests can check its panic check still sees
# one. Never flashed.
[[example]]
name = "panics"
test = false
bench = false

# Divides a `u16` by ten, so xtask's tests can check a wide multiply still
# fails to link. Never flashed, and never linked.
[[example]]
name = "multiplies"
test = false
bench = false

[lints]
workspace = true

# Panics can't unwind on AVR. Size beats speed on 16 KB of flash, and debug
# info only lands in the ELF, never in the hex.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true
# Arithmetic LLVM can't prove fits then links a panic, which `cargo xtask hex`
# refuses, so nothing wraps by accident.
overflow-checks = true

[profile.dev]
panic = "abort"
opt-level = "s"
